<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- Header (Full Width) -->
<header class="header">
  <div class="left-section">
      <img src="ats.png" alt="Logo" class="logo">
      <span class="theme-toggle">🌙</span>
      <div class="search-box">
          <input type="text" placeholder="Search....">
          <button><span class="search-icon">🔍</span></button>
      </div>
  </div>
  
  <div class="right-section">
      <span class="notification">🔔</span>
      
      <div class="language-select">
          <span>🌐</span> English 
      </div>
      
      <div class="status">
          <span class="active-dot"></span> Active
      </div>
      
      <div class="user-profile">
          <img src="https://img.freepik.com/free-photo/young-bearded-man-with-striped-shirt_273609-5677.jpg?t=st=1745848535~exp=1745852135~hmac=0ff4d157a4d5e3b84a3b5cab5c9cf2c8f329c03d3837cbc03570931840f3fca4&w=1380" alt="User">
          <div class="user-info">
            <div class="username">Guest<span class="online-dot"></span></div>
            <div id="time">18:16:06</div>
          </div>
      </div>
      
      <div class="menu-toggle">≡</div>
  </div>
</header>
<script>
  // Update time every second
  function updateTime() {
    const now = new Date();
    document.getElementById("time").textContent = now.toLocaleTimeString('en-GB');
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>


<!-- Sidebar + Main Content -->
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      
      <a href="dashboard.html" target="_blank"> <i class="fas fa-home"></i> Home</a>
      <a href="customer.html" target="_blank"><i class="fas fa-user"></i> Customers</a>
      <a href="Product.html"><i class="fas fa-box"></i> Product</a>
      <a href="#"><i class="fas fa-comments"></i> Feedback </a>
      <a href="#"><i class="fas fa-glass-whiskey"></i> Milk Collection</a>
      <a href="#"> <i class="fas fa-dollar-sign"></i> Revenue</a>
      <a href="login.html"> <i class="fa fa-sign-out""></i> Logout</a>
    </nav>
  </aside>


  <!-- Content -->
  <main class="main-content">
    <section class="cards">
      <div class="card">
        <div class="icon">
          <i class="fas fa-users"></i>
        </div>
        <div class="info">
          <h3>Employees</h3>
          <p>145</p>
        </div>
      </div>
    
      <!-- Products Card -->
      <div class="card">
        <div class="icon">
          <i class="fas fa-box-open"></i>
        </div>
        <div class="info">
          <h3>Products</h3>
          <p>1,230</p>
        </div>
      </div>
    
      <!-- Sales Card -->
      <div class="card">
        <div class="icon">
          <i class="fas fa-dollar-sign"></i>
        </div>
        <div class="info">
          <h3>Sales</h3>
          <p>$23,400</p>
        </div>
      </div>
    
      <!-- Returns Card -->
      <div class="card">
        <div class="icon">
          <i class="fas fa-undo-alt"></i>
        </div>
        <div class="info">
          <h3>Returns</h3>
          <p>120</p>
        </div>
      </div>
    
    </section>

    <section class="charts">
      <div class="chart-box">
        <img src="https://quickchart.io/chart?c={type:'pie',data:{labels:['Full-time','Part-time'],datasets:[{data:[70,30]}]}}" alt="Chart 1">
      </div>
      <div class="chart-box">
        <img src="https://quickchart.io/chart?c={type:'pie',data:{labels:['Sold','Returned','In Stock'],datasets:[{data:[50,10,40]}]}}" alt="Chart 2">
      </div>
    </section>
  </main>
</div>

<script>
  function updateStatusDot(select) {
    const dot = document.querySelector('.status-dot');
    dot.className = 'status-dot';
    if (select.value === 'Active') dot.classList.add('active');
    else if (select.value === 'Do Not Disturb') dot.classList.add('dnd');
    else dot.classList.add('away');
  }
  
</script>

</body>
</html>
