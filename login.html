<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="main-container">
    <!-- Login Form Section -->
    <div class="container">
        <h2>Login</h2>
        <form action="dashboard.html" method="get">
            <div class="input-icon">
                <i class="fa fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-icon">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div class="password">
            <a href="password.html">Forgot Password</a>
             </div>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </form>
    </div>

    <!-- Image Section -->
    <div class="image-container">
        <img src="https://img.freepik.com/free-vector/mobile-login-concept-illustration_114360-83.jpg?t=st=1744800338~exp=1744803938~hmac=bcbad27f2bf267782b6259e8d16893ed32e82f6348941b70f013e2c453cb1288&w=900" alt="Desk Illustration">
    </div>
</div>

</body>
</html>
