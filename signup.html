<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome CDN -->
    <!--<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">-->

</head>
<body>
    <div class="main-container">
        <div class="form-container">
            <h2>Sign up</h2>
            <form>
                <div class="input-group">
                    <label><i class="fa fa-user"></i> Your Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="input-group">
                    <label><i class="fa fa-envelope"></i> Your Email</label>
                    <input type="email" placeholder="Your Email" required>
                </div>
                <div class="input-group">
                    <label><i class="fa fa-lock"></i> Password</label>
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <label><i class="fa fa-lock"></i> Repeat your password</label>
                    <input type="password" placeholder="Repeat your password" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="agree">
                    <label for="agree">I agree all statements in <a href="#">Terms of service</a></label>
                </div>
                <button type="submit">Register</button>
            </form>
            <p class="login-link"><a href="#">I already have account!</a></p>
        </div>
        <div class="image-container">
            <img src="https://img.freepik.com/premium-vector/empty-modern-workplace-office-interior-vector-image_141192-158.jpg?w=1380" alt="Desk Illustration">
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
