<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diary Product Analytics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="analytics-container">
    <h1>Diary Product Analytics Dashboard</h1>

    <!-- Analytics Summary -->
    <div class="summary-cards">
      <div class="card">
        <h2>Total Reviews</h2>
        <p>138</p>
      </div>
      <div class="card">
        <h2>Avg. Rating</h2>
        <p>4.3 ★</p>
      </div>
      <div class="card">
        <h2>Top Mood</h2>
        <p>😊 Happy</p>
      </div>
    </div>

    <!-- Product Feedback Bar Chart (Static) -->
    <h2>Feedback by Product</h2>
    <div class="bar-chart">
      <div class="bar-item">
        <label>Dairy Milk</label>
        <div class="bar" style="width: 80%;">80%</div>
      </div>
      <div class="bar-item">
        <label>Greek Yogurt</label>
        <div class="bar" style="width: 60%;">60%</div>
      </div>
      <div class="bar-item">
        <label>Cheese Block</label>
        <div class="bar" style="width: 45%;">45%</div>
      </div>
      <div class="bar-item">
        <label>Butter</label>
        <div class="bar" style="width: 30%;">30%</div>
      </div>
    </div>
  </div>
</body>
</html>
