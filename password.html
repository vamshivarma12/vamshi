<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="main-container">
    <!-- Forgot Password Form Section -->
    <div class="container">
        <h2>Forgot Password</h2>
        <form action="forgot-password" method="post">
            <div class="input-icon">
                <i class="fa fa-envelope"></i>
                <input type="email" name="email" placeholder="Enter your registered email" required>
            </div>
            <button type="submit">Send Reset Link</button>
            <p>Remember your password? <a href="login.html">Login</a></p>
        </form>
    </div>

    <!-- Image Section -->
    <div class="image-container">
        <img src="https://img.freepik.com/free-vector/feedback-loop-concept-illustration_114360-15497.jpg?t=st=1744801825~exp=1744805425~hmac=b6b2023bb8f5d79ee214b5c96b4a16a67b503bf0e456edcbc891dccf3f4cc972&w=900" alt="Desk Illustration">
    </div>
</div>

</body>
</html>
