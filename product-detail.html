<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="product-detail-container">
    <a href="index.html">← Back to Products</a>
    <h2 id="product-name"></h2>
    <img id="product-image" src="" alt="Product Image" />
    <p id="product-price"></p>
    <p id="product-description"></p>
    <button class="add-cart-btn">Add to Cart</button>
  </div>

  <script>
    const products = {
      milk: {
        name: "Milk",
        image: "https://cdn.pixabay.com/photo/2016/05/02/10/39/milk-1365285_1280.jpg",
        price: "₹50 / litre",
        description: "Fresh and pure cow milk, rich in calcium and vitamins."
      },
      cheese: {
        name: "Cheese",
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJKunr9Vqo6Bj_uH29GKo22S1aL352lRb0DQ&s",
        price: "₹120 / 200g",
        description: "Delicious creamy cheese made from full-fat milk."
      },
      yogurt: {
        name: "Yogurt",
        image: "https://cdn.pixabay.com/photo/2016/10/25/12/28/yogurt-1761026_1280.jpg",
        price: "₹30 / cup",
        description: "Natural yogurt, probiotic-rich and refreshing."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const product = products[id];

    if (product) {
      document.getElementById("product-name").textContent = product.name;
      document.getElementById("product-image").src = product.image;
      document.getElementById("product-price").textContent = product.price;
      document.getElementById("product-description").textContent = product.description;
    } else {
      document.body.innerHTML = "<h2>Product not found</h2>";
    }

    document.querySelector('.add-cart-btn').addEventListener('click', () => {
      alert(product.name + " added to cart!");
    });
  </script>
</body>
</html>
